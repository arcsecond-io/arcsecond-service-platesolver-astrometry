name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["master"]

jobs:
  build-and-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tooling
        run: python -m pip install build

      - name: Install project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install . -v 2>&1 | Tee-Object -Variable pip_out
          if ($LASTEXITCODE -ne 0) {
            # Extract compiler errors (lines with "error" in them)
            $errors = $pip_out | Select-String -Pattern "error C\d+|error:|\\.c\(\d+\)" | Select-Object -Last 100
            Write-Host "=== COMPILER ERRORS ==="
            $errors | ForEach-Object { Write-Host $_.Line }
            Write-Host "=== END ERRORS ==="
            echo "## Build Errors" >> $env:GITHUB_STEP_SUMMARY
            $errors | ForEach-Object { echo ("``" + $_.Line + "``") >> $env:GITHUB_STEP_SUMMARY }
            exit 1
          }

      - name: Install project (non-Windows)
        if: runner.os != 'Windows'
        run: python -m pip install .

      - name: Smoke test import and cache path
        run: python -c "from arcsecond_service_platesolver.main import _resolve_cache_dir; print(_resolve_cache_dir())"

      - name: Build package
        run: python -m build
