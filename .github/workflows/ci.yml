name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["master"]
    tags: ["v*"]

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tooling
        run: python -m pip install build pytest

      - name: Install project (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install .

      - name: Install project (non-Windows)
        if: runner.os != 'Windows'
        run: python -m pip install .

      # The suite stubs the solver out, so it needs none of the 10 GB of index files. Running it
      # on both runners is deliberate: the solve deadline works by killing a worker process, and
      # `spawn` semantics are the part most likely to differ between Linux and Windows.
      - name: Run tests
        run: python -m pytest

      - name: Build package
        run: python -m build

  docker-publish:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          progress: plain
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:buildcache
          cache-to: type=registry,ref=ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:buildcache,mode=max
