name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["master"]

jobs:
  build-and-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tooling
        run: python -m pip install build

      - name: Install project (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install .

      - name: Install project (non-Windows)
        if: runner.os != 'Windows'
        run: python -m pip install .

      - name: Smoke test import and cache path
        run: python -c "from arcsecond_service_platesolver.main import _resolve_cache_dir; print(_resolve_cache_dir())"

      - name: Build package
        run: python -m build

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:latest
            ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:buildcache
          cache-to: type=registry,ref=ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:buildcache,mode=max
