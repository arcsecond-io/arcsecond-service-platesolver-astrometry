[project]
name = "arcsecond-service-platesolver-astrometry"
version = "0.1.0"
description = "Arcsecond plate solver based on astrometry.net indexes"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Arcsecond" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=2.2",
    "astropy>=7.2",
    "astrometry @ git+https://github.com/arcsecond-io/astrometry.git@8f17089fc21016ba6b605dcc5790b661cc44a3b0 ; platform_system == 'Windows'",
    "astrometry>=4.3.0 ; platform_system != 'Windows'",
]

[project.scripts]
arcsecond-platesolver = "arcsecond_service_platesolver.main:run"

[project.urls]
Homepage = "https://github.com/arcsecond-io/arcsecond-service-platesolver-astrometry"
Issues = "https://github.com/arcsecond-io/arcsecond-service-platesolver-astrometry/issues"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcsecond_service_platesolver"]

[tool.hatch.metadata]
allow-direct-references = true
