[project]
name = "arcsecond-service-platesolver-astrometry"
version = "1.3.0"
description = "Arcsecond plate solver based on astrometry.net indexes"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Arcsecond" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=2.2",
    "astropy>=7.2",
    "arcsecond-astrometry>=4.3.0 ; platform_system == 'Windows'",
    "astrometry>=4.3.0 ; platform_system != 'Windows'",
]

[project.scripts]
arcsecond-platesolver = "arcsecond_service_platesolver.main:run"

[project.urls]
Homepage = "https://github.com/arcsecond-io/arcsecond-service-platesolver-astrometry"
Issues = "https://github.com/arcsecond-io/arcsecond-service-platesolver-astrometry/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `spawn` workers re-import the test module, so keep import mode default (prepend) and rely on
# tests/__init__.py making `tests.stubs` resolvable in the child process.
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcsecond_service_platesolver"]

[tool.hatch.metadata]
allow-direct-references = true
